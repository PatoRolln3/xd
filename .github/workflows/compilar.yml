name: Compilar Novela Visual RenPy a iOS
on: workflow_dispatch:
jobs: build-ios: runs-on: macos-latest
steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Descargar y Descomprimir juego pesado
    run: |
      curl -L -o juego.zip "https://mediafire.com"
      unzip juego.zip
      mv my_femboy_roomate game || true
      mv x-game game || true

  - name: Instalar Entorno RenPy
    uses: PaxlavaGames/renpy-install@v0.3.0
    with:
      version: "8.2.0"

  - name: Compilar IPA de iOS
    uses: PaxlavaGames/renpy-build@0.3.0
    with:
      path: "./"

  - name: Guardar archivo IPA de iOS
    uses: actions/upload-artifact@v4
    with:
      name: my_femboy_roommate_iOS
      path: ./build/*.ipa
