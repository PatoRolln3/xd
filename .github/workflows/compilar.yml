name: Compilar Novela Visual RenPy a iOS

on:
  workflow_dispatch: # Esto activa un botón manual para iniciar la compilación

jobs:
  build-ios:
    runs-on: macos-latest # GitHub te prestará una Mac virtual para compilarlo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar y Compilar con RenPy
        uses: PaxlavaGames/renpy-build@0.3.0
        with:
          path: "./"
          version: "8.2.0" # Cambia esto a "7.7.0" si tu juego es antiguo

      - name: Guardar archivo IPA de iOS
        uses: actions/upload-artifact@v4
        with:
          name: my_femboy_roomate_iOS
          path: ./build/*.ipa
