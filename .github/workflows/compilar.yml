name: Compilar Novela Visual RenPy a iOS
on: workflow_dispatch:
jobs:build-ios:runs-on: macos-latest
steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Descargar y Preparar Juego
    run: |
      curl -L -o juego.zip "https://mediafire.com"
      unzip juego.zip
      TARGET_DIR=$(find . -type d -name "game" -o -name "x-game" | head -n 1)
      if [ -z "$TARGET_DIR" ]; then
        TARGET_DIR=$(dirname $(find . -name "options.rpy" | head -n 1))
      fi
      if [ -d "$TARGET_DIR" ] && [ "$TARGET_DIR" != "./game" ]; then
        mv "$TARGET_DIR" ./game
      fi

  - name: Instalar Entorno RenPy
    uses: PaxlavaGames/renpy-install@v0.3.0
    with:
      version: "8.2.0"

  - name: Compilar IPA de iOS
    uses: PaxlavaGames/renpy-build@0.3.0
    with:
      path: "./"

  - name: Guardar archivo IPA de iOS
    uses: actions/upload-artifact@v4
    with:
      name: my_femboy_roommate_iOS
      path: ./build/*.ipa
